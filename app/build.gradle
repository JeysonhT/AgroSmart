plugins {
    alias(libs.plugins.android.application) apply true
    id 'com.google.gms.google-services' apply true
    alias(libs.plugins.secrets.gradle.plugin) apply true
    alias(libs.plugins.ksp) apply true
    alias(libs.plugins.hilt.android) apply true
    alias(libs.plugins.kotlin.compose) apply true
    alias(libs.plugins.kotlin.serialization) apply true
}

android {
    namespace 'com.example.agrosmart'
    compileSdk 37
    packagingOptions {
        resources {
            pickFirsts += ['mockito-extensions/org.mockito.plugins.MockMaker', 'mockito-extensions/org.mockito.plugins.MemberAccessor']
        }
    }


    defaultConfig {
        applicationId "com.example.agrosmart"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        mlModelBinding true
        buildConfig true
        compose true
    }

    testOptions {
        animationsDisabled = true
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }
}

def mockitoVersion = "5.2.0"

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.video

    implementation libs.camera.view
    implementation libs.camera.extensions

    implementation(libs.guava)

    implementation libs.firebase.firestore
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.play.services.auth
    implementation(libs.credentials.play.services.auth)
    implementation libs.facebook.android.sdk
    implementation(libs.credentials)
    implementation(libs.googleid)
    implementation libs.appcompat
    implementation libs.lifecycle.common
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.glide
    implementation libs.play.services.base
    implementation libs.play.services.tasks
    implementation libs.opencsv
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation libs.lottie
    implementation libs.lottie.compose

    implementation libs.litert.support
    implementation libs.litert.metadata

    implementation libs.litert.gpu

    implementation libs.retrofit
    implementation libs.converter.gson

    // TESTS LOCALES (test)
    testImplementation libs.junit
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.mockito.core
    testImplementation libs.robolectric
    testImplementation libs.androidx.core

    // REMUEVE mockito-inline si causa problemas
    // testImplementation "org.mockito:mockito-inline:$mockitoVersion"

    // TESTS INSTRUMENTADOS (androidTest)
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.androidx.espresso.intents
    androidTestImplementation libs.androidx.espresso.contrib
    androidTestImplementation libs.androidx.runner
    androidTestImplementation libs.androidx.navigation.testing

    // PARA ANDROIDTEST USA SOLO mockito.android
    androidTestImplementation libs.mockito.android

    // Excluir Protobuf conflictivo en tests
    androidTestImplementation('com.google.firebase:firebase-firestore') {
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
        exclude group: 'com.google.protobuf', module: 'protobuf-javalite'
    }

    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // Coroutines
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android
    testImplementation libs.kotlinx.coroutines.test

    // Lifecycle KTX
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.runtime.ktx

    // Room Database
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler

    // Hilt Dependency Injection
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // Jetpack Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.runtime.livedata
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.hilt.navigation.compose
    implementation libs.kotlinx.serialization.json
    debugImplementation libs.androidx.compose.ui.tooling
}